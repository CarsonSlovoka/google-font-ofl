name: Generate GitHub Pages from Lua scan

on:
  push:
    branches: [main, master]
  # schedule:
  #   # Weekly refresh to pick up new Google Fonts upstream files
  #   - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install system dependencies (fd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fd-find
          # Debian/Ubuntu binary is named fdfind
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd
          fd --version

      - name: Install Neovim (latest stable)
        run: |
          curl -fsSL -o nvim-linux-x86_64.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          sudo mv nvim-linux-x86_64 /opt/nvim
          echo "/opt/nvim/bin" >> "$GITHUB_PATH"
          nvim --version | head -3

      - name: Fetch latest upstream files from google/fonts (sparse)
        run: |
          set -euo pipefail
          rm -rf ofl
          mkdir -p ofl
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --single-branch \
            --branch main \
            https://github.com/google/fonts.git /tmp/google-fonts
          (
            cd /tmp/google-fonts
            git sparse-checkout set --no-cone \
              '/ofl/**/upstream_info.md'      \
              '/ofl/**/METADATA.pb'           \
              '/ofl/**/OFL.txt'

            if [ -d ofl ]; then
              cp -a ofl/. "$GITHUB_WORKSPACE/ofl/"
            fi
          )

      - name: Run Lua scanner (stdout → list.md, stderr → no_found.md, also data.json)
        id: scan
        run: |
          set +e
          nvim --headless -l scripts/find_github_page.lua \
            1>list.md \
            2>no_found.md
          EXIT_CODE=$?
          set -e
          echo "Lua exit code: $EXIT_CODE"
          echo "=== list.md (head) ==="
          # 只取前20筆，方便github上用訊息來debug
          head -n 20 list.md || true
          echo "=== no_found.md (head) ==="
          head -n 20 no_found.md || true
          echo "=== data.json exists? ==="
          ls -la data.json || true

          if [ ! -f list.md ]; then
            echo "ERROR: list.md was not produced"
            exit 1
          fi
          if [ ! -f data.json ]; then
            echo "ERROR: data.json was not produced by Lua scanner"
            exit 1
          fi

          # Extract counts
          SUCCESS=$(grep -oP '成功數量:\K[0-9]+' list.md || echo 0)
          FAIL=$(grep -oP '失敗總數量:\K[0-9]+' no_found.md || echo 0)
          echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"
          echo "Success: $SUCCESS  Fail: $FAIL"

      - name: Enrich data.json with stars / forks / language (GitHub API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed

          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "google-fonts-ofl-pages",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items") or []
          # unique (username, repo) → list of item indices
          unique = {}
          for i, it in enumerate(items):
              key = (it.get("username") or "", it.get("repo_name") or "")
              unique.setdefault(key, []).append(i)

          print(f"Items: {len(items)}, unique repos: {len(unique)}")

          def fetch_repo(username, repo):
              url = f"https://api.github.com/repos/{username}/{repo}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = json.loads(resp.read().decode())
                      return {
                          "stars": body.get("stargazers_count", 0),
                          "forks": body.get("forks_count", 0),
                          "language": body.get("language") or "",
                          "description": body.get("description") or "",
                      }
              except urllib.error.HTTPError as e:
                  return {"stars": -1, "forks": -1, "language": "", "error": f"HTTP {e.code}"}
              except Exception as e:
                  return {"stars": -1, "forks": -1, "language": "", "error": str(e)}

          results = {}
          # modest parallelism to stay polite with secondary rate limits
          with ThreadPoolExecutor(max_workers=8) as ex:
              futs = {
                  ex.submit(fetch_repo, u, r): (u, r)
                  for (u, r) in unique.keys()
                  if u and r
              }
              done = 0
              for fut in as_completed(futs):
                  key = futs[fut]
                  results[key] = fut.result()
                  done += 1
                  if done % 50 == 0 or done == len(futs):
                      print(f"  fetched {done}/{len(futs)}")

          enriched = 0
          for (u, r), idxs in unique.items():
              info = results.get((u, r), {"stars": -1, "forks": -1, "language": ""})
              for i in idxs:
                  items[i]["stars"] = info.get("stars", -1)
                  items[i]["forks"] = info.get("forks", -1)
                  items[i]["language"] = info.get("language") or ""
                  if "description" in info and info["description"]:
                      items[i]["description"] = info["description"]
                  if items[i]["stars"] >= 0:
                      enriched += 1

          data["items"] = items
          data["enriched_count"] = enriched
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"Enriched {enriched}/{len(items)} items → data.json")
          PY

      - name: Build static site for GitHub Pages
        env:
          SUCCESS: ${{ steps.scan.outputs.success_count }}
          FAIL: ${{ steps.scan.outputs.fail_count }}
        run: |
          set -euo pipefail
          mkdir -p _site

          # Copy template (HTML / CSS / JS) — editable outside the workflow
          cp -a site/. _site/

          # Data files (置換成生成出來的檔案)
          cp data.json _site/data.json
          cp list.md _site/list.md
          cp no_found.md _site/no_found.md

          GENERATED_AT=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # Optional: stamp a small meta file for debugging
          printf '%s\n' "$GENERATED_AT" > _site/generated_at.txt

          echo "Site contents:"
          find _site -type f | sort
          echo "--- data.json head ---"
          head -c 400 _site/data.json || true
          echo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
