name: Generate GitHub Pages from Lua scan

on:
  push:
    branches: [main, master]
  schedule:
    # Weekly refresh to pick up new Google Fonts upstream files
    # 03:00 (六) UTC+8
    - cron: "0 19 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install system dependencies (fd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fd-find
          # Debian/Ubuntu binary is named fdfind
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd
          fd --version

      - name: Install Neovim (latest stable)
        run: |
          curl -fsSL -o nvim-linux-x86_64.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          sudo mv nvim-linux-x86_64 /opt/nvim
          echo "/opt/nvim/bin" >> "$GITHUB_PATH"
          nvim --version | head -3

      - name: Fetch latest upstream files from google/fonts (sparse)
        run: |
          set -euo pipefail
          rm -rf ofl
          mkdir -p ofl
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --single-branch \
            --branch main \
            https://github.com/google/fonts.git /tmp/google-fonts
          (
            cd /tmp/google-fonts
            git sparse-checkout set --no-cone \
              '/ofl/**/upstream_info.md'      \
              '/ofl/**/METADATA.pb'           \
              '/ofl/**/OFL.txt'

            if [ -d ofl ]; then
              cp -a ofl/. "$GITHUB_WORKSPACE/ofl/"
            fi
          )

      - name: Run Lua scanner (stdout → list.md, stderr → no_found.md, also data.json)
        id: scan
        run: |
          set +e
          nvim --headless -l scripts/find_github_page.lua \
            1>list.md \
            2>no_found.md
          EXIT_CODE=$?
          set -e
          echo "Lua exit code: $EXIT_CODE"
          echo "=== list.md (head) ==="
          # 只取前20筆，方便github上用訊息來debug
          head -n 20 list.md || true
          echo "=== no_found.md (head) ==="
          head -n 20 no_found.md || true
          echo "=== data.json exists? ==="
          ls -la data.json || true

          if [ ! -f list.md ]; then
            echo "ERROR: list.md was not produced"
            exit 1
          fi
          if [ ! -f data.json ]; then
            echo "ERROR: data.json was not produced by Lua scanner"
            exit 1
          fi

          # Extract counts
          SUCCESS=$(grep -oP '成功數量:\K[0-9]+' list.md || echo 0)
          FAIL=$(grep -oP '失敗總數量:\K[0-9]+' no_found.md || echo 0)
          echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"
          echo "Success: $SUCCESS  Fail: $FAIL"

      - name: (legacy - disabled) Enrich data.json (stars / forks / language / recent activity / workflows)
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Logic lives in scripts/enrich_github_data.py (maintainable outside YAML)
          python3 scripts/enrich_github_data.py data.json --with-workflows
          # python3 scripts/enrich_github_data.py data.json  # 也行, 但是否有action就會不曉得
      - name: Enrich data.json (Tree API + sources / workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v2 enricher — single pass for meta + tree/files
          # Output overwrites data.json in place (same path Lua produced)
          python3 scripts/enrich_github_data_tree.py data.json -o data.json
          echo "=== enrich summary (tail) ==="
          # tree script prints progress to stderr; confirm schema keys exist
          python3 - <<'PY'
          import json
          with open("data.json", encoding="utf-8") as f:
              d = json.load(f)
          items = d.get("items") or []
          print(f"items={len(items)} enrich_version={d.get('enrich_version')}")
          print(f"tree_method_counts={d.get('tree_method_counts')}")
          n_glyphs = sum(1 for it in items if it.get("has_glyphs"))
          n_pkg = sum(1 for it in items if it.get("has_glyphspackage"))
          n_wf = sum(1 for it in items if it.get("workflows"))
          print(f"has_glyphs={n_glyphs} has_glyphspackage={n_pkg} with_workflows={n_wf}")
          PY

      - name: Build static site for GitHub Pages
        env:
          SUCCESS: ${{ steps.scan.outputs.success_count }}
          FAIL: ${{ steps.scan.outputs.fail_count }}
        run: |
          set -euo pipefail
          mkdir -p _site

          # Copy template (HTML / CSS / JS) — editable outside the workflow
          cp -a site/. _site/

          # Data files (置換成生成出來的檔案)
          cp data.json _site/data.json
          mkdir -p _site/v2
          cp data.json _site/v2/data.json

          cp list.md _site/list.md
          cp no_found.md _site/no_found.md

          GENERATED_AT=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # Optional: stamp a small meta file for debugging
          printf '%s\n' "$GENERATED_AT" > _site/generated_at.txt

          echo "Site contents:"
          find _site -type f | sort
          echo "--- data.json head ---"
          head -c 400 _site/data.json || true
          echo
          echo "--- v2 data.json exists? ---"
          ls -la _site/v2/data.json _site/v2/index.html _site/v2/js/app.js || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

