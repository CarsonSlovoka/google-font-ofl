name: Generate GitHub Pages from Lua scan

on:
  push:
    branches: [main, master]
# schedule:
#   # Weekly refresh to pick up new Google Fonts ARTICLE files
#   - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install system dependencies (fd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fd-find
          # Debian/Ubuntu binary is named fdfind
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd
          fd --version

      - name: Install Neovim (latest stable)
        run: |
          curl -fsSL -o nvim-linux-x86_64.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          sudo mv nvim-linux-x86_64 /opt/nvim
          echo "/opt/nvim/bin" >> "$GITHUB_PATH"
          nvim --version | head -3

      - name: Fetch latest ARTICLE.en_us.html from google/fonts (sparse)
        run: |
          set -euo pipefail
          rm -rf ofl
          mkdir -p ofl
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --single-branch \
            --branch main \
            https://github.com/google/fonts.git /tmp/google-fonts
          (
            cd /tmp/google-fonts
            git sparse-checkout set --no-cone 'ofl/**/ARTICLE.en_us.html'
            if [ -d ofl ]; then
              cp -a ofl/. "$GITHUB_WORKSPACE/ofl/"
            fi
          )
          echo "ARTICLE count:"
          find ofl -name 'ARTICLE.en_us.html' | wc -l
          find ofl -name 'ARTICLE.en_us.html' | head -5

      - name: Run Lua scanner (stdout → list.md, stderr → no_found.md)
        id: scan
        run: |
          set +e
          nvim --headless -l scripts/find_github_page.lua \
            1>list.md \
            2>no_found.md
          EXIT_CODE=$?
          set -e
          echo "Lua exit code: $EXIT_CODE"
          echo "=== list.md (head) ==="
          head -n 20 list.md || true
          echo "=== no_found.md (head) ==="
          head -n 20 no_found.md || true

          if [ ! -f list.md ]; then
            echo "ERROR: list.md was not produced"
            exit 1
          fi

          # Extract counts (script always writes 成功數量 even on partial success)
          SUCCESS=$(grep -oP '成功數量:\K[0-9]+' list.md || echo 0)
          FAIL=$(grep -oP '失敗總數量:\K[0-9]+' no_found.md || echo 0)
          echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"
          echo "Success: $SUCCESS  Fail: $FAIL"

      - name: Build static site for GitHub Pages
        env:
          SUCCESS: ${{ steps.scan.outputs.success_count }}
          FAIL: ${{ steps.scan.outputs.fail_count }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp list.md _site/list.md
          cp no_found.md _site/no_found.md
          GENERATED_AT=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Write HTML template
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Google Fonts OFL → GitHub Pages</title>
            <style>
              :root { color-scheme: light dark; }
              body {
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
                max-width: 960px; margin: 2rem auto; padding: 0 1.2rem; line-height: 1.55;
              }
              h1 { font-size: 1.6rem; }
              h2 { margin-top: 2rem; border-bottom: 1px solid #ccc; padding-bottom: 0.3rem; }
              .meta { color: #666; font-size: 0.95rem; }
              pre {
                background: #f4f4f5; padding: 1rem; overflow: auto; border-radius: 6px;
                white-space: pre-wrap; word-break: break-word; font-size: 0.9rem;
              }
              @media (prefers-color-scheme: dark) {
                pre { background: #1e1e1e; }
              }
              a { color: #0969da; }
              .badge {
                display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
                font-size: 0.85rem; background: #eef; margin-right: 0.4rem;
              }
              .badge.ok { background: #d1fae5; color: #065f46; }
              .badge.fail { background: #fee2e2; color: #991b1b; }
              footer { margin-top: 3rem; font-size: 0.85rem; color: #888; }
            </style>
          </head>
          <body>
            <h1>Google Fonts OFL · Upstream GitHub Repositories</h1>
            <p class="meta">
              本頁由 GitHub Actions 執行 <code>scripts/find_github_page.lua</code> 自動產生。<br>
              掃描 <code>google/fonts</code> 倉庫中所有 <code>ofl/**/ARTICLE.en_us.html</code>，
              抽出各字體 family 的官方 GitHub 連結。
            </p>
            <p>
              <span class="badge ok">成功：__SUCCESS__</span>
              <span class="badge fail">找不到 GitHub：__FAIL__</span>
              <span class="badge">產生時間：__GENERATED_AT__</span>
            </p>
            <p>
              原始輸出檔：
              <a href="list.md">list.md</a> ·
              <a href="no_found.md">no_found.md</a>
            </p>

            <h2>✅ 已找到 GitHub 的 family（stdout / list.md）</h2>
            <pre>__LIST_CONTENT__</pre>

            <h2>⚠️ 找不到 GitHub 連結的 family（stderr / no_found.md）</h2>
            <pre>__NOFOUND_CONTENT__</pre>

            <footer>
              Source: <a href="https://github.com/google/fonts">google/fonts</a> ·
              Scanner: <code>nvim -l scripts/find_github_page.lua</code>
            </footer>
          </body>
          </html>
          HTML

          # Safely inject content with Python (handles escaping)
          SUCCESS="$SUCCESS" FAIL="$FAIL" GENERATED_AT="$GENERATED_AT" python3 -c '
          import pathlib, html, os
          site = pathlib.Path("_site")
          index = (site / "index.html").read_text(encoding="utf-8")
          list_md = (site / "list.md").read_text(encoding="utf-8", errors="replace")
          nofound = (site / "no_found.md").read_text(encoding="utf-8", errors="replace")
          index = index.replace("__SUCCESS__", os.environ.get("SUCCESS", "0"))
          index = index.replace("__FAIL__", os.environ.get("FAIL", "0"))
          index = index.replace("__GENERATED_AT__", os.environ.get("GENERATED_AT", ""))
          index = index.replace("__LIST_CONTENT__", html.escape(list_md))
          index = index.replace("__NOFOUND_CONTENT__", html.escape(nofound))
          (site / "index.html").write_text(index, encoding="utf-8")
          print("index.html generated successfully")
          print("Site contents:")
          for p in sorted(site.iterdir()):
              print(" ", p.name, p.stat().st_size, "bytes")
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
